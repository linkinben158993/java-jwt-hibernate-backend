gatling {
    totalAsyncThreads = 10
    minAsyncThreadsPerScenario = 2

    environments {
        local {
            totalTps = 2
            duration = 60
        }
    }
}

# HTTP/DB targets are read from env vars by the perf module (N5 local source; Vault/SSM = TODO):
#   HTTP_BASE_URL  (default http://localhost:4201)
#   DB_URL         (default jdbc:mysql://localhost:3307/jwt_db)
#   DB_USER        (default root)
#   DB_PASSWORD    (default empty)
#   DB_POOL_SIZE   (default 2 — N3: keep minimal so the test doesn't exhaust the app's DB connections)
